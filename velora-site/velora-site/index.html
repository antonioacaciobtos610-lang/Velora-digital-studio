<style>
:root{--bg:#05070a;--g1:#0c1016;--g2:#151a22;--tx:#f4f6f9;--mt:#9aa3b0;--bl:#1e6bff;--bl2:#4d90ff;--ln:rgba(255,255,255,.1);--f:Montserrat,system-ui,sans-serif;--s:"Cormorant Garamond",Georgia,serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:300 16px/1.65 var(--f);overflow-x:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--bl2);outline-offset:3px}
.sk{position:absolute;left:-999px}.sk:focus{left:12px;top:12px;z-index:99;background:#fff;color:#000;padding:8px 14px}
.wrap{max-width:1240px;margin:0 auto;padding:0 clamp(20px,5vw,56px)}
h1,h2,h3{font-weight:300;margin:0;letter-spacing:-.02em;line-height:1.05}
.eb{font-size:11px;letter-spacing:.4em;text-transform:uppercase;color:var(--bl2);display:flex;gap:14px;align-items:center}
.eb::before{content:"";width:36px;height:1px;background:var(--bl)}
h2{font-size:clamp(34px,5.5vw,68px);margin:18px 0 24px}
section{padding:clamp(80px,12vw,160px) 0;position:relative}
/* intro */
#intro{position:fixed;inset:0;z-index:100;background:#000;display:grid;place-items:center;transition:opacity 1s .2s,visibility 1s .2s}
#intro.off{opacity:0;visibility:hidden}
#intro svg{width:min(240px,50vw);overflow:visible}
#intro .dr{stroke-dasharray:400;stroke-dashoffset:400;animation:dr 1.6s ease forwards}
#intro p{letter-spacing:.7em;font-size:12px;margin:18px 0 0 .7em;text-align:center;opacity:0;animation:fi 1s .9s forwards}
@keyframes dr{to{stroke-dashoffset:0}}@keyframes fi{to{opacity:1}}
/* header */
header{position:fixed;top:0;left:0;right:0;z-index:50;padding-top:env(safe-area-inset-top,0px);transition:background .4s,transform .4s,border-color .4s;border-bottom:1px solid transparent}
header.sc{background:rgba(5,7,10,.66);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-color:var(--ln)}
header.hd{transform:translateY(-100%)}
.nv{display:flex;align-items:center;justify-content:space-between;height:68px;gap:18px}
.lg{display:flex;align-items:center;gap:10px;font-weight:500;letter-spacing:.38em;font-size:14px}
.lg svg{width:30px}
nav ul{display:flex;gap:30px;list-style:none;margin:0;padding:0}
nav a{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--mt);transition:color .3s}
nav a:hover{color:#fff}
.rt{display:flex;align-items:center;gap:14px}
.lang{display:flex;gap:2px;font-size:11px;letter-spacing:.14em}
.lang button{background:none;border:0;color:var(--mt);padding:8px 7px;cursor:pointer;font:inherit}
.lang button[aria-pressed=true]{color:#fff;box-shadow:inset 0 -1px var(--bl2)}
.btn{display:inline-flex;align-items:center;gap:12px;padding:15px 28px;border:1px solid var(--ln);font:500 12px var(--f);letter-spacing:.18em;text-transform:uppercase;color:#fff;background:rgba(255,255,255,.03);cursor:pointer;position:relative;overflow:hidden;transition:border-color .4s,transform .3s}
.btn::before{content:"";position:absolute;inset:0;background:var(--bl);transform:translateX(-101%);transition:transform .5s cubic-bezier(.2,.8,.2,1);z-index:-1}
.btn:hover{border-color:var(--bl);transform:translateY(-2px)}.btn:hover::before{transform:none}
.btn.p{background:var(--bl);border-color:var(--bl)}.btn.p::before{background:#fff}.btn.p:hover{color:#000}
.btn.sm{padding:10px 18px}
.bg{display:none;background:none;border:1px solid var(--ln);color:#fff;width:42px;height:42px;cursor:pointer}
/* hero */
.hero{min-height:100svh;display:flex;align-items:flex-end;padding:140px 0 90px;overflow:hidden;isolation:isolate}
.hb{position:absolute;inset:-8% 0;z-index:-1;background:
radial-gradient(ellipse 60% 50% at 78% 38%,rgba(30,107,255,.38),transparent 70%),
radial-gradient(ellipse 40% 30% at 70% 45%,rgba(180,205,255,.14),transparent 70%),
linear-gradient(115deg,#05070a 30%,#0b1220 60%,#05070a);will-change:transform}
.hb::before{content:"";position:absolute;left:35%;right:-10%;top:42%;height:1px;background:linear-gradient(90deg,transparent,#8fb5ff,transparent);box-shadow:0 0 40px 6px rgba(30,107,255,.5);animation:bm 7s ease-in-out infinite alternate}
.hb::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,transparent 0 120px,rgba(255,255,255,.025) 120px 121px),linear-gradient(0deg,var(--bg),transparent 40%)}
@keyframes bm{from{opacity:.35;transform:scaleX(.7)}to{opacity:1;transform:scaleX(1)}}
.hm{position:absolute;right:6%;top:50%;width:min(44vw,520px);transform:translateY(-55%);z-index:-1;opacity:.9;filter:drop-shadow(0 0 60px rgba(30,107,255,.45))}
.hero h1{font-size:clamp(42px,8vw,112px);max-width:11ch;margin:22px 0}
.hero h1 em{font-family:var(--s);font-style:italic;font-weight:400;color:var(--bl2)}
.hero p{max-width:480px;color:var(--mt);font-size:17px}
.hc{display:flex;gap:14px;flex-wrap:wrap;margin-top:34px}
.scr{position:absolute;bottom:26px;left:50%;font-size:10px;letter-spacing:.4em;color:var(--mt);text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:10px;transform:translateX(-50%)}
.scr i{width:1px;height:40px;background:linear-gradient(var(--bl2),transparent);animation:sc 2s infinite}
@keyframes sc{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
/* reveal */
.rv{opacity:0;transform:translateY(40px);filter:blur(6px);transition:opacity 1.1s,transform 1.1s cubic-bezier(.2,.8,.2,1),filter 1.1s}
.rv.in{opacity:1;transform:none;filter:none}
/* portfolio */
.pg{display:grid;grid-template-columns:repeat(12,1fr);gap:28px;margin-top:56px}
.pj{position:relative;display:block;overflow:hidden;min-height:380px;border:1px solid var(--ln);background:var(--g1)}
.pj:nth-child(1){grid-column:1/8;min-height:520px}.pj:nth-child(2){grid-column:8/13;margin-top:80px}
.pj:nth-child(3){grid-column:1/6}.pj:nth-child(4){grid-column:6/13;min-height:460px;margin-top:-60px}
.art{position:absolute;inset:0;background:var(--art);transition:transform 1.4s cubic-bezier(.2,.8,.2,1)}
.pj:hover .art{transform:scale(1.08)}
.art::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(5,7,10,.92),transparent 65%)}
.big{position:absolute;right:-2%;top:6%;font-size:clamp(70px,11vw,150px);font-weight:600;letter-spacing:-.04em;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.22);line-height:1;transition:-webkit-text-stroke-color .5s,transform .8s}
.pj:hover .big{-webkit-text-stroke-color:rgba(255,255,255,.6);transform:translateX(-12px)}
.pi{position:absolute;left:0;right:0;bottom:0;padding:30px}
.pi small{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--bl2)}
.pi h3{font-size:32px;margin:8px 0}.pi p{margin:0 0 18px;color:#c4cad3;max-width:380px;font-size:15px}
.pi span{font-size:12px;letter-spacing:.2em;text-transform:uppercase;border-bottom:1px solid var(--bl);padding-bottom:4px}
.nt{color:var(--mt);font-size:13px;margin-top:40px}
/* services */
.sv{border-top:1px solid var(--ln);margin-top:40px}
.sr{display:grid;grid-template-columns:80px 1fr 1.2fr;gap:24px;padding:34px 0;border-bottom:1px solid var(--ln);align-items:baseline;transition:padding .5s,background .5s}
.sr:hover{padding-left:20px;background:linear-gradient(90deg,rgba(30,107,255,.12),transparent)}
.sr b{color:var(--bl2);font-weight:400;font-size:12px;letter-spacing:.2em}
.sr h3{font-size:clamp(22px,3vw,36px)}.sr p{margin:0;color:var(--mt)}
/* process */
.ps{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--ln);border:1px solid var(--ln);margin-top:50px}
.st{background:var(--g1);padding:34px 24px 40px;min-height:300px;position:relative;overflow:hidden;transition:background .5s}
.st:hover{background:var(--g2)}
.st i{position:absolute;right:-8px;bottom:-30px;font:600 130px/1 var(--f);font-style:normal;color:transparent;-webkit-text-stroke:1px rgba(77,144,255,.3)}
.st h3{font-size:24px;margin:50px 0 12px}.st p{color:var(--mt);font-size:14px;margin:0;position:relative}
/* about */
.ab{display:grid;grid-template-columns:1fr 1fr;gap:clamp(30px,6vw,90px);align-items:center}
.ab p{color:var(--mt);font-size:17px}.ab .q{font:italic 400 clamp(26px,3.4vw,42px)/1.25 var(--s);color:#fff}
/* contact */
form{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:40px}
.fd{display:flex;flex-direction:column;gap:8px}.fd.w{grid-column:1/-1}
label{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--mt)}
input,select,textarea{background:var(--g1);border:1px solid var(--ln);color:#fff;padding:15px;font:300 15px var(--f);border-radius:0;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--bl);outline:0;box-shadow:0 0 0 3px rgba(30,107,255,.25)}
[aria-invalid=true]{border-color:#ff6b6b}
.er{color:#ff8a8a;font-size:12px;min-height:16px}
#fm{grid-column:1/-1;font-size:14px}
#fm.ok{color:#7fe0a8}#fm.bad{color:#ff8a8a}
.cg{display:grid;grid-template-columns:1fr 1.2fr;gap:clamp(30px,6vw,90px)}
/* footer */
footer{border-top:1px solid var(--ln);padding:70px 0 40px;background:var(--g1)}
.fg{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:40px}
footer p,footer li,footer a{color:var(--mt);font-size:14px}footer ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}
footer a:hover{color:#fff}footer h4{font-size:11px;letter-spacing:.3em;text-transform:uppercase;margin:0 0 18px;font-weight:500}
.cp{margin-top:50px;padding-top:24px;border-top:1px solid var(--ln);font-size:12px;color:var(--mt)}
/* demo */
#demo{display:none;min-height:100vh;background:var(--d0);color:var(--d1);position:relative;isolation:isolate}
body.dm #site{display:none}body.dm #demo{display:block}body.dm header{display:none}
#demo .art{position:absolute;inset:0;z-index:-1;background:var(--art)}
#demo .art::after{background:linear-gradient(0deg,var(--d0),transparent 60%,rgba(0,0,0,.3))}
.dt{display:flex;justify-content:space-between;align-items:center;padding:24px 0;font-size:12px;letter-spacing:.3em;text-transform:uppercase}
.dh{min-height:78vh;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:70px}
.dh h1{font-size:clamp(46px,10vw,150px);font-family:var(--dh)}.dh p{max-width:520px;font-size:18px;opacity:.8}
.dc{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:color-mix(in srgb,var(--d1) 18%,transparent);border:1px solid color-mix(in srgb,var(--d1) 18%,transparent)}
.dc div{background:var(--d0);padding:36px 28px}.dc h3{font-size:24px;font-family:var(--dh);margin-bottom:12px}.dc p{margin:0;opacity:.7;font-size:15px}
.dn{padding:50px 0 80px;font-size:13px;opacity:.6}
.dx{color:var(--d2);border-color:var(--d2)}
@media(max-width:960px){
nav{position:fixed;inset:0;background:rgba(5,7,10,.97);display:none;padding:100px 30px}nav.op{display:block}
nav ul{flex-direction:column;gap:22px}nav a{font-size:20px}.bg{display:block}.rt .btn{display:none}
.pg{grid-template-columns:1fr}.pj,.pj:nth-child(n){grid-column:auto;margin:0;min-height:420px}
.ps{grid-template-columns:1fr 1fr}.ab,.cg,.fg,.dc{grid-template-columns:1fr}.sr{grid-template-columns:50px 1fr}.sr p{grid-column:2}
.hm{opacity:.35;right:-20%}}
@media(max-width:560px){form{grid-template-columns:1fr}.ps{grid-template-columns:1fr}.hero{padding-bottom:110px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}html{scroll-behavior:auto}.rv{opacity:1;transform:none;filter:none}#intro{display:none}}
</style>
</head>
